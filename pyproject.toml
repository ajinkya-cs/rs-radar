[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rs-radar"
dynamic = ["version"]
description = "Relative-strength & momentum signal radar for crypto and US stocks, as an MCP server and CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ajinkya-cs" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "crypto", "stocks", "relative-strength", "momentum", "screener", "trading-signals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/ajinkya-cs/rs-radar"
Issues = "https://github.com/ajinkya-cs/rs-radar/issues"
Changelog = "https://github.com/ajinkya-cs/rs-radar/blob/main/CHANGELOG.md"

[project.scripts]
rs-radar = "rs_radar.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.4",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/rs_radar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rs_radar"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC", "S", "PT", "RET", "TID"]
ignore = [
    "PLR0913",  # analytics functions legitimately take many parameters
    "PLR2004",  # thresholds are named where they matter; tests use literal fixtures
    "S603",     # subprocess calls use fixed argv lists, never a shell
    "SIM905",   # whitespace-split word lists keep long symbol tables readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "S311"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: hits live public APIs (deselected by default in CI)"]
